name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the package claims to support, and the current one.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Syntax
        run: node --check index.js

      # Protocol handshake + tool-schema validation. Offline: no network, no
      # credentials, no browser download, so it is safe on a public runner.
      - name: Smoke test
        run: node scripts/smoke.mjs
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Hygiene (secrets, personal data, tracked state files)
        run: node scripts/hygiene.mjs

      # The suite drives a real browser against a local fixture portal, so a
      # browser has to be there: --ignore-scripts above skipped the download.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # xvfb, because taxme_login opens a visible window — that is the point of
      # it, and the suite exercises it rather than mocking it away. The coverage
      # thresholds are enforced here: a drop below them fails the build.
      - name: Tests and coverage
        run: xvfb-run -a npm run coverage

      - name: Audit
        run: npm audit --audit-level=high
        continue-on-error: true
